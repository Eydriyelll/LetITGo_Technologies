<body>
  <!--
    Static HTML/CSS skeleton shown before Flutter's engine finishes
    downloading and booting. This is the *very first* paint — it exists
    purely so there's never a blank white/black tab. Flutter's own
    SkeletonLoadingScreen widget (see lib/widgets/skeleton_loader.dart)
    takes over immediately after the engine boots and stays until app
    bootstrap work finishes.
  -->
  <style>
    html, body { height: 100%; margin: 0; background: #061838; }
    #boot-skeleton {
      position: fixed; inset: 0;
      background: linear-gradient(to bottom, #061838, #0B2447);
      display: flex; align-items: center; justify-content: center;
    }
    #boot-skeleton .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #40B5FF; margin: 0 4px;
      animation: ligt-pulse 1.1s ease-in-out infinite;
    }
    #boot-skeleton .dot:nth-child(2) { animation-delay: 0.15s; }
    #boot-skeleton .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes ligt-pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }
  </style>
  <div id="boot-skeleton" role="status" aria-label="Loading Let IT Go Technologies">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-skeleton');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
